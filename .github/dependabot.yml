# Keeps the SHA-pinned GitHub Actions and the NuGet packages current with monthly pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The project files live under src/ and tests/, not at the repository root.
  - package-ecosystem: nuget
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      nuget-packages:
        patterns:
          - "*"
