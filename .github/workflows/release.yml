name: Release

# Pushing a tag such as v0.2.0-alpha or v1.0.0 builds, tests and publishes SellSpec, then creates a GitHub
# release with the artifacts and SHA256SUMS.txt attached. Tags containing a hyphen are marked pre-release.
#
# Safety rules enforced below:
#   - the tag must have the exact form v<major>.<minor>.<patch>[-<suffix>] and equal the version in
#     Directory.Build.props (case-sensitive);
#   - the tagged commit must already be on main (no releases from unreviewed branches);
#   - the tag name is never interpolated into shell or PowerShell source;
#   - building runs in a read-only job; only the small release job holds `contents: write`, and it never
#     runs the build toolchain or third-party build actions;
#   - the release is created as a draft and published only after every asset uploaded;
#   - runs for the same tag are serialised so two runs cannot interleave their uploads;
#   - every action is pinned to a full commit SHA (Dependabot proposes updates).
#
# Code signing (CODE_SIGNING_POLICY.md; DEVELOPMENT.md, "Code signing"): when the repository variable
# SIGNPATH_ORGANIZATION_ID is set, the executables are signed by SignPath Foundation. The unsigned executables
# are uploaded as a workflow artifact, SignPath verifies that this workflow run built them (origin
# verification), an approver approves the request by hand, and the signed copies replace the unsigned ones
# before the zip and checksums are rebuilt. Signing fails closed: any signing error fails the run, so an
# unsigned release can only be produced when signing is not configured, and its notes then say so. The
# SignPath API token is exposed to that one step only; the build job holds `actions: read` so SignPath can
# fetch the artifact with the workflow token.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    name: Verify, build, test, publish and sign
    runs-on: windows-latest
    # Generous because release signing waits for a human approval in SignPath (up to an hour).
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.apply-signed.outcome == 'success' }}

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        shell: pwsh
        run: |
          # Fetch main into its remote-tracking ref explicitly so the check always sees the branch as it is now.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error 'Could not fetch main.'; exit 1 }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "The tagged commit is not on main. Merge it through a pull request first, then tag the merged commit."
            exit 1
          }

      - name: Check that the tag matches the version in Directory.Build.props
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          # Case-sensitive: "V1.0.0" or "v1.0.0-Alpha" must not pass as the canonical tag.
          if (-not ($tag -cmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.]*)?)$')) {
            Write-Error "Tag '$tag' does not match the required format v<major>.<minor>.<patch>[-<suffix>]."
            exit 1
          }
          $tagVersion = $Matches.version

          $props = [xml](Get-Content Directory.Build.props -Raw)
          $prefixNode = $props.SelectSingleNode('/Project/PropertyGroup/VersionPrefix')
          $suffixNode = $props.SelectSingleNode('/Project/PropertyGroup/VersionSuffix')
          $prefix = if ($prefixNode) { $prefixNode.InnerText.Trim() } else { '' }
          $suffix = if ($suffixNode) { $suffixNode.InnerText.Trim() } else { '' }
          if (-not $prefix) {
            Write-Error 'VersionPrefix is missing from Directory.Build.props.'
            exit 1
          }
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }

          if ($tagVersion -cne $version) {
            Write-Error "Tag '$tag' does not match the project version '$version'. Update Directory.Build.props (and CHANGELOG.md) before tagging."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SellSpec.slnx

      - name: Build (Release)
        run: dotnet build SellSpec.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SellSpec.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish artifacts
        shell: pwsh
        run: ./build/publish.ps1 -SkipTests

      # ---- Code signing by SignPath Foundation (runs only when the repository is configured for it) ----
      - name: Stage the executables for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: ./build/signing.ps1 -Stage -ArtifactsDirectory artifacts -StagingDirectory signing/unsigned

      - name: Upload the unsigned executables for SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SellSpec-${{ steps.version.outputs.version }}-unsigned
          path: signing/unsigned
          if-no-files-found: error
          retention-days: 1

      - name: Submit the signing request to SignPath and wait for approval
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing requires a manual approval in SignPath; allow up to an hour for it.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed

      - name: Verify the signatures and replace the executables
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: apply-signed
        shell: pwsh
        run: ./build/signing.ps1 -Apply -ArtifactsDirectory artifacts -SignedDirectory signing/signed
      # ------------------------------------------------------------------------------------------------

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SellSpec-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SellSpec-${{ needs.build.outputs.version }}-win-x64
          path: artifacts

      - name: List release files
        run: ls -l artifacts

      # The release is created as a draft so that nothing becomes public until every asset is attached.
      - name: Create draft release with all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: SellSpec ${{ needs.build.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            SellSpec ${{ needs.build.outputs.version }} for Windows 10/11 (64-bit). See CHANGELOG.md for details and KNOWN_LIMITATIONS.md for what is still partial or estimated.

            | File | Needs |
            |---|---|
            | `SellSpec-${{ needs.build.outputs.version }}-win-x64-selfcontained.exe` | nothing |
            | `SellSpec-${{ needs.build.outputs.version }}-win-x64-singlefile.exe` | [.NET Desktop Runtime 10](https://dotnet.microsoft.com/download/dotnet/10.0) |
            | `SellSpec-${{ needs.build.outputs.version }}-win-x64-portable.zip` | .NET Desktop Runtime 10; keeps settings beside the exe |

            Verify downloads with `SHA256SUMS.txt` (`sha256sum -c SHA256SUMS.txt`).

            ${{ needs.build.outputs.signed == 'true' && 'The executables are code-signed by SignPath Foundation. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || 'The executables are not code-signed, so Windows SmartScreen may warn on first launch.' }} See the [Code signing policy](https://github.com/SamJustSam-create/SellSpec/blob/main/CODE_SIGNING_POLICY.md).
          files: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
