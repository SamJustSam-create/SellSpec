name: Detection report
description: SellSpec showed a wrong or missing specification for a device.
title: "[Detection] <device>: <what was wrong>"
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make SellSpec more accurate. The most useful report has three things: the device, what SellSpec showed, and what the correct value is.

        **Please do not include serial numbers, service tags, MAC/IP addresses or product keys.** The diagnostics bundle SellSpec creates (Settings → *Report a detection problem*) never contains them.
  - type: input
    id: device
    attributes:
      label: Device
      description: Make and model as printed on the device or its label (not the serial number).
      placeholder: "Lenovo IdeaPad Slim 5 14IAH8"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: From Settings → System → About (edition, version and build).
      placeholder: "Windows 11 Home 24H2, build 26100.4061"
    validations:
      required: true
  - type: input
    id: sellspec-version
    attributes:
      label: SellSpec version
      description: Shown on the About page and in the Overview sidebar.
      placeholder: "0.1.1-alpha"
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What SellSpec showed
      description: Copy the value(s) from the Overview or Specifications page, including any label such as "Estimated" or "Firmware reported".
      placeholder: "Display: 14-inch Full HD (Estimated)"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have said, and how you know
      description: The correct value and its source (the maker's spec sheet, the label on the part, another tool).
      placeholder: "Panel is 13.3-inch per Lenovo PSREF: https://psref.lenovo.com/..."
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw strings (optional extra)
      description: The bundle already contains these. If something specific stood out, paste it here from the Specifications page with *Show technical details* ticked (raw manufacturer/model/version, raw processor or graphics names, chassis codes, EDID codes).
      render: text
  - type: checkboxes
    id: bundle
    attributes:
      label: Diagnostics bundle
      description: The bundle is required; it is how a detection problem gets fixed. If SellSpec cannot produce one (for example it crashes first), file a Bug report instead.
      options:
        - label: I have attached the diagnostics bundle (.zip) saved from Settings → Report a detection problem
          required: true
        - label: I confirm the report contains no serial numbers, service tags or other identifiers
          required: true
