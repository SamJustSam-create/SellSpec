name: Bug report
description: Something in SellSpec crashed, froze, or behaved wrongly (other than a detected value).
title: "[Bug] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a wrong or missing hardware value use the **Detection report** form instead. Please do not paste serial numbers, addresses or product keys.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: sellspec-version
    attributes:
      label: SellSpec version
      placeholder: "0.1.1-alpha"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 Pro 25H2, build 26200.9974"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which download
      options:
        - Self-contained exe
        - Single-file exe (framework-dependent)
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: Settings → *Open log folder*; the log is already sanitised. Paste the lines around the problem.
      render: text
