<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!--
    SellSpec logo: a price tag carrying a short spec list, on the Windows accent blue.
    This file is the master. build\make-icon.ps1 renders it to the application icon and the sidebar PNG, so keep to
    the subset it understands: <path> with solid or linear-gradient fills, fill-rule and optional strokes; <g> with
    translate/rotate/scale transforms; data-min-size="N" / data-max-size="N" on an element to include it only in
    frames at least / at most N px wide.
    The hole and the spec lines are cut out of the tag with the even-odd rule, so the background shows through
    unchanged whatever the tag's rotation.
  -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#2F90EC"/>
      <stop offset="1" stop-color="#0A58B4"/>
    </linearGradient>
  </defs>
  <path id="background" fill="url(#bg)" d="M14 0H50A14 14 0 0 1 64 14V50A14 14 0 0 1 50 64H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0Z"/>
  <g id="tag" transform="rotate(-24 32 33)">
    <!-- Large frames: tag outline, hole and three spec lines. -->
    <path id="label" data-min-size="24" fill="#FFFFFF" fill-rule="evenodd" d="M30.2 11.2Q32 9.4 33.8 11.2L46.2 23.6Q47.2 24.6 47.2 26V51Q47.2 54.4 43.8 54.4H20.2Q16.8 54.4 16.8 51V26Q16.8 24.6 17.8 23.6Z M28.6 22.4A3.4 3.4 0 1 0 35.4 22.4A3.4 3.4 0 1 0 28.6 22.4Z M22.5 31.6H41.5A1.8 1.8 0 0 1 41.5 35.2H22.5A1.8 1.8 0 0 1 22.5 31.6Z M22.5 38.6H35.5A1.8 1.8 0 0 1 35.5 42.2H22.5A1.8 1.8 0 0 1 22.5 38.6Z M22.5 45.6H38.5A1.8 1.8 0 0 1 38.5 49.2H22.5A1.8 1.8 0 0 1 22.5 45.6Z"/>
    <!-- Small frames (taskbar, title bar): the same tag and hole without the lines, which would smear at this size. -->
    <path id="label-small" data-max-size="23" fill="#FFFFFF" fill-rule="evenodd" d="M30.2 11.2Q32 9.4 33.8 11.2L46.2 23.6Q47.2 24.6 47.2 26V51Q47.2 54.4 43.8 54.4H20.2Q16.8 54.4 16.8 51V26Q16.8 24.6 17.8 23.6Z M28.6 22.4A3.4 3.4 0 1 0 35.4 22.4A3.4 3.4 0 1 0 28.6 22.4Z"/>
  </g>
</svg>
